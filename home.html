<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: rgb(255, 232, 98);
      margin: 30px;
      gap: 2em;
    }
    .foto > img {
      width: 250px;
      border-radius: 50%;
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    .welcome {
      font-size: 40px;  
      cursor: pointer;
    }

    .welcome:hover {
      color: rgb(150, 84, 5);
      animation: spin 3s linear infinite;
    }
  </style>
</head>
<body>
  <div class="foto">
    <img src="images/saya.jpg" alt="gambar">
  </div>
  <div class="welcome">
    <h3>Welcome to my Website guys!</h3>
  </div>
</body>
</html>
