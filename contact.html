<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: rgb(255, 232, 98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .contact-container {
      text-align: center;
      background-color: rgb(255, 213, 74);
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }

    .contact-container h2 {
      font-size: 32px;
      color: #ffffff;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
    }

    .social-icons a {
      display: inline-block;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .social-icons a:hover {
      transform: scale(1.2);
    }

    .social-icons img {
      width: 50px;
      height: 50px;
    }

    .contact-container {
      padding: 20px;
    }

    .contact-container > h2 {
      font-size: 34px;
    }

    .social-icons img {
      width: 40px;
      height: 40px;
    }
    
  </style>
</head>
<body>
  <div class="contact-container">
    <h2>Contact Me</h2>
    <div class="social-icons">
      <a href="https://www.instagram.com/dhanikwp" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/2048px-Instagram_icon.png" alt="Instagram">
      </a>
      <a href="mailto:dhanikusuma256@gmail.com">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Gmail_icon_%282020%29.svg/512px-Gmail_icon_%282020%29.svg.png" alt="Gmail">
      </a>
      <a href="https://www.facebook.com/dhanikwp" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Facebook_f_logo_%282019%29.svg/1200px-Facebook_f_logo_%282019%29.svg.png" alt="Facebook">
      </a>
    </div>
  </div>
</body>
</html>
